services:
  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:?set NEO4J_AUTH to neo4j/<strong-password>}"
    volumes:
      - odkg-neo4j-data:/data
      - odkg-neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  odkg-neo4j-data:
  odkg-neo4j-logs:
