# Reference only. Run scripts/render_hermes_config.py to produce an executable
# config with absolute Windows paths under runtime/hermes-home/config.yaml.
mcp_servers:
  ontology_driven_kg:
    command: "C:/absolute/path/to/.venv-hermes/Scripts/python.exe"
    args: ["-m", "odkg.mcp_server"]
    env:
      PYTHONPATH: "C:/absolute/path/to/ontology-driven-kg-system/src"
      ODKG_RUNTIME_DIR: "C:/absolute/path/to/ontology-driven-kg-system/runtime/hermes-odkg"
    tools:
      include:
        - get_ontology_version
        - get_evolution_policy
        - get_graph_status
        - list_semantic_adapters
        - get_llm_harness_status
        - list_versions
        - get_version_manifest
        - ingest_and_preview
        - ingest_and_run
        - preview_update_cycle
        - llm_semantic_perception
        - llm_ontology_evolution
        - llm_decision_planning
        - llm_action_execution
        - run_llm_multi_agent_maritime
        - preview_maritime_events
        - run_maritime_events
        - run_update_cycle
        - rollback_latest
